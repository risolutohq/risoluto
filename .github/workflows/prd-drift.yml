name: PRD Drift Check

on:
  pull_request:
    paths:
      - "docs/prds/*.md"

permissions:
  contents: read

jobs:
  prd-drift:
    name: PRD ↔ Linear sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check PRD drift
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: pnpm run prd:drift-check -- --all
